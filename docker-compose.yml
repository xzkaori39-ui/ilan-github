# i兰 / iLAN · 全栈编排（MongoDB + Redis + Python 后端 + pi 智能体服务 + Next.js 前端）
# 用法：docker compose up --build
name: ilan

services:
  mongodb:
    image: mongo:7.0
    container_name: ilan-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-wenshu}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-wenshu}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "${MONGO_INITDB_ROOT_USERNAME:-wenshu}", "-p", "${MONGO_INITDB_ROOT_PASSWORD:-wenshu}", "--authenticationDatabase", "admin", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ilan-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-wenshu}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus standalone 依赖 etcd（元数据）与 MinIO（对象存储）。
  # 默认后端仍为 Mongo；需要原生向量检索时设置 VECTOR_BACKEND=milvus。
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ilan-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    command: >-
      etcd
      --advertise-client-urls=http://etcd:2379
      --listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ilan-minio
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: ilan-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    container_name: ilan-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  backend:
    build:
      context: ./backend
    container_name: ilan-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-wenshu}:${MONGO_INITDB_ROOT_PASSWORD:-wenshu}@mongodb:27017/${MONGODB_DB:-wenshu}?authSource=admin
      REDIS_ADDR: redis://:${REDIS_PASSWORD:-wenshu}@redis:6379
      PI_AGENT_URL: http://pi-agent:8100
      PI_AGENT_ENABLED: "true"
      VECTOR_BACKEND: ${VECTOR_BACKEND:-mongo}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-ilan_chunks}
      MILVUS_DIMENSION: ${MILVUS_DIMENSION:-1024}
      HOST: 0.0.0.0
      PORT: 8000
      UPLOAD_STORAGE_DIR: /data/uploads
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - ./demo_data:/app/demo_data:ro
      - upload_data:/data/uploads

  worker:
    build:
      context: ./backend
    container_name: ilan-worker
    restart: unless-stopped
    command: ["python", "-m", "scripts.async_worker"]
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-wenshu}:${MONGO_INITDB_ROOT_PASSWORD:-wenshu}@mongodb:27017/${MONGODB_DB:-wenshu}?authSource=admin
      REDIS_ADDR: redis://:${REDIS_PASSWORD:-wenshu}@redis:6379
      STORAGE_MODE: mongo
      VECTOR_BACKEND: ${VECTOR_BACKEND:-mongo}
      MILVUS_URI: http://milvus:19530
      MILVUS_COLLECTION: ${MILVUS_COLLECTION:-ilan_chunks}
      MILVUS_DIMENSION: ${MILVUS_DIMENSION:-1024}
      UPLOAD_STORAGE_DIR: /data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
    volumes:
      - upload_data:/data/uploads

  pi-agent:
    build:
      context: ./services/pi-agent
    container_name: ilan-pi-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8100
      HOST: 0.0.0.0
      BACKEND_URL: http://backend:8000
    ports:
      - "8100:8100"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      args:
        BACKEND_URL: http://backend:8000
    container_name: ilan-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      PORT: 3000
    ports:
      - "8080:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
  redis_data:
  upload_data:
  neo4j_data:
  neo4j_logs:
  etcd_data:
  minio_data:
  milvus_data:
